name: tempodesk

services:
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD in .env}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?Set RUNTIME_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - type: bind
        source: ./docker/postgres/init.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrator:
    image: tempodesk-migrator:local
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: server/tools/TempoDesk.DatabaseMigrator/Dockerfile
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    environment:
      TEMPODESK_DB_HOST: postgres
      TEMPODESK_DB_PORT: "5432"
      TEMPODESK_DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      TEMPODESK_MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: tempodesk-api:local
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      args:
        PROJECT: TempoDesk.Api
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    command: [dotnet, TempoDesk.Api.dll]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Database__Host: postgres
      Database__Port: "5432"
      Database__Name: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      Database__Username: tempodesk_runtime
      Database__Password: ${RUNTIME_PASSWORD:?Set RUNTIME_PASSWORD in .env}
      Database__CommandTimeoutSeconds: "3"
      Authentication__Enabled: "true"
      Authentication__Issuer: http://localhost:${API_PORT:-5023}
      Authentication__Audience: tempodesk-api
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Authentication__AccessTokenMinutes: "15"
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-5173}
      Email__Enabled: "true"
      Email__Host: mailpit
      Email__Port: "1025"
      Email__From: no-reply@tempodesk.local
      Email__FrontendBaseUrl: http://localhost:${WEB_PORT:-5173}
    ports:
      - "127.0.0.1:${API_PORT:-5023}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD, dotnet, TempoDesk.Api.dll, --health-check]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    init: true
    stop_grace_period: 20s

  worker:
    image: tempodesk-worker:local
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      args:
        PROJECT: TempoDesk.Worker
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    command: [dotnet, TempoDesk.Worker.dll]
    environment:
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Development}
      Database__Host: postgres
      Database__Port: "5432"
      Database__Name: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      Database__Username: tempodesk_runtime
      Database__Password: ${RUNTIME_PASSWORD:?Set RUNTIME_PASSWORD in .env}
      Database__CommandTimeoutSeconds: "3"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, dotnet, TempoDesk.Worker.dll, --health-check]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    init: true
    stop_grace_period: 20s

  web:
    image: tempodesk-web:local
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: client/web/Dockerfile
      platforms:
        - ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    init: true
    stop_grace_period: 20s

volumes:
  postgres_data:
