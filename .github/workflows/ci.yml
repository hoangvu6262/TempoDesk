name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

env:
  JWT_SIGNING_KEY: ci-only-signing-key-not-for-production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            server/**/*.csproj
            server/Directory.Build.props
            global.json
      - run: dotnet restore server/TempoDesk.sln -p:NuGetAuditLevel=high
      - run: dotnet build server/TempoDesk.sln --configuration Release --no-restore
      - run: dotnet test server/TempoDesk.sln --configuration Release --no-build
      - name: NuGet dependency report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p artifacts/audit
          dotnet list server/TempoDesk.sln package --vulnerable --include-transitive --format json --output-version 1 --no-restore > artifacts/audit/nuget.json
      - name: Upload backend audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-results
          path: artifacts/audit/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: npm dependency policy
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
